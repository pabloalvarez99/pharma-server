name: bench

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: cargo bench (windows)
    # Only run when PR carries the `bench` label — avoid burning CI minutes on every push.
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo bench
        shell: bash
        run: cargo bench --workspace || echo "no benches yet"
