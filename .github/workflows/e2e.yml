name: e2e

# Full client gate: client build (tsc + vite) + unit tests (vitest) + a live
# stack e2e that builds a REAL pharma-api + pharma, boots the server on a
# throwaway SurrealKv DB, and drives the operator's daily loop over real HTTP for
# BOTH verticals (see client/e2e/README.md). No mocks, no webview. The job runs
# the SAME single command developers run locally: `cd client && npm run gate`.
#
# MANUAL on purpose. CI minutes on this repo are billing-walled (CLAUDE.md regla
# #9 / teamwork_op.txt), so push/PR must NOT auto-burn minutes — the CANONICAL
# gate is LOCAL (`cd client && npm run gate`, exit-nonzero on any failure). This
# workflow makes that exact gate reproducible in CI when a human opts in; it is
# `workflow_dispatch` only, so it never triggers on push/PR.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: client gate (build + test + live-stack e2e) (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pre-build the binaries through cargo so rust-cache covers them; the
      # harness then finds them present and skips its own build (E2E_REBUILD unset).
      - name: build server + cli (release)
        run: cargo build --release -p api -p cli

      - name: install client deps
        working-directory: client
        run: npm ci

      # The exact local gate: build (tsc + vite) + unit (vitest) + live e2e.
      - name: run client gate
        working-directory: client
        run: npm run gate
