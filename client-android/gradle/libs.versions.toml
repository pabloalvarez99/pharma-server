# PISO DE HARDWARE — por qué estas versiones y no las últimas
#
# El techo lo pone `minSdk = 21` (CLAUDE.md, regla 1). AndroidX dejó de soportar
# API 21 y 22 a mitad de 2025: todo lo publicado después declara `minSdk 23` y el
# manifest merger corta el build. Verificado leyendo el AndroidManifest de cada
# AAR, no adivinado:
#
#   androidx.compose.animation:animation-core  1.9.x -> minSdk 21
#                                              1.10.0 -> minSdk 23   <- corta acá
#   androidx.compose.material3                 1.4.0  -> minSdk 21
#   androidx.lifecycle                         2.9.4  -> minSdk 21
#   androidx.activity                          1.11.0 -> minSdk 21
#
# Por eso NO se usa el BOM de Compose: el BOM arrastra 1.10+. Cada artefacto va
# pinneado a la última versión que todavía entra en un Android 5.0.
# El día que el fundador acepte subir a minSdk 23 esto se destraba solo.

[versions]
agp = "8.13.2"
# Kotlin va emparejado con el R8 que trae AGP 8.13.2. Con Kotlin 2.4.x el D8/R8
# de este AGP no sabe leer la metadata ("Unexpected error during rewriting of
# Kotlin metadata") y en release eso se paga en el shrinker. 2.2.21 es la última
# línea que este AGP entiende sin ruido.
kotlin = "2.2.21"

# Compose — última línea con minSdk 21
composeUi = "1.9.5"
composeMaterial3 = "1.4.0"

androidxActivity = "1.11.0"
androidxCore = "1.17.0"
androidxLifecycle = "2.9.4"
androidxNavigation = "2.9.8"
androidxDatastore = "1.1.7"
androidxProfileinstaller = "1.4.1"

ktor = "3.5.2"
serializationJson = "1.9.0"
coroutines = "1.10.2"

junit = "4.13.2"
# Robolectric corre los tests de layout del design system en la JVM. 4.14.1 es
# la primera que trae SDK 35/36; los tests igual se fijan a sdk 34, que es donde
# vive la curva NO LINEAL de escala de letra que introdujo Android 14 — medir
# ahí es medir lo que el usuario realmente recibe.
robolectric = "4.14.1"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileinstaller" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeUi" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "composeUi" }
compose-ui-text = { module = "androidx.compose.ui:ui-text", version.ref = "composeUi" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "composeUi" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "composeUi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUi" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUi" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
