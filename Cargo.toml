[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/api",
    "crates/auth",
    "crates/jobs",
    "crates/telemetry",
    "crates/service",
    "crates/cli",
    "crates/domain",
    "crates/agent",
]

[workspace.package]
version = "0.1.15"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"
authors = ["Pablo Alvarez <pablobfa1999@gmail.com>"]
repository = "https://github.com/pabloalvarez99/pharma-server"

[workspace.dependencies]
# async runtime
tokio = { version = "1.41", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# web
axum = { version = "0.8", features = ["macros", "tokio", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id", "timeout"] }
hyper = "1.5"

# serde / errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# db
surrealdb = { version = "2.1", features = ["kv-surrealkv"] }
include_dir = "0.7"

# auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

# openapi
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# config
config = "0.14"
toml = "0.8"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
axum-prometheus = "0.7"

# jobs
tokio-cron-scheduler = "0.13"
async-nats = "0.38"

# windows
windows-service = "0.7"

# cli
clap = { version = "4", features = ["derive"] }
rpassword = "7"

# time
chrono = { version = "0.4", features = ["serde"] }

# csv import/export
csv = "1.3"

# backup archives
tar = "0.4"
flate2 = "1.0"

# agent identity / signed envelopes (Fase 11 ecosystem)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
# `line-tables-only` keeps backtraces but shrinks PDBs ~10x. Required: the full
# surrealdb dependency graph in debug=1 overflows MSVC's per-PDB size limit
# (LNK1140) and fills the disk. Workspace crates still get line info.
debug = "line-tables-only"

# Third-party deps don't need debug info at all — biggest PDB/disk win.
[profile.dev.package."*"]
debug = false

# Tests inherit dev; keep them linkable on Windows MSVC.
[profile.test.package."*"]
debug = false
