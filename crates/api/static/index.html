<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Pharma Server</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --panel-2: #1a2330;
    --border: #233042;
    --text: #e6edf3;
    --muted: #8b97a5;
    --accent: #4f9eff;
    --accent-2: #2d7fe0;
    --ok: #3ddc97;
    --err: #ff6b6b;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
  }
  header {
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  header .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  main {
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.12s;
  }
  input:focus { border-color: var(--accent); }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button:hover { background: var(--accent-2); }
  button.secondary:hover { background: var(--border); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .status-item { flex: 1; min-width: 140px; }
  .status-item .k { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .status-item .v { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-size: 12px;
    color: var(--muted);
    overflow: auto;
    max-height: 260px;
    margin: 8px 0 0;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  footer {
    padding: 10px 22px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>pharma-server</h1>
  <span class="badge" id="version">v?</span>
</header>

<main>
  <section class="card">
    <h2>Estado del servidor</h2>
    <div class="status-row">
      <div class="status-item">
        <div class="k">Live</div>
        <div class="v" id="live">…</div>
      </div>
      <div class="status-item">
        <div class="k">Ready (DB)</div>
        <div class="v" id="ready">…</div>
      </div>
      <div class="status-item">
        <div class="k">Uptime</div>
        <div class="v" id="uptime">—</div>
      </div>
    </div>
    <button class="secondary" id="refresh">Refrescar</button>
  </section>

  <section class="card">
    <h2>Iniciar sesión</h2>
    <label>Tenant (slug)</label>
    <input id="tenant" value="demo" />
    <label>Email</label>
    <input id="email" value="admin@demo.test" />
    <label>Contraseña</label>
    <input id="password" type="password" placeholder="…" />
    <button id="login">Entrar</button>
    <div class="msg" id="login-msg"></div>
  </section>

  <section class="card" style="grid-column: 1 / -1;">
    <h2>Sesión activa</h2>
    <div class="status-row">
      <div class="status-item">
        <div class="k">Estado</div>
        <div class="v" id="auth-state">No autenticado</div>
      </div>
      <div class="status-item">
        <div class="k">Tenant</div>
        <div class="v" id="auth-tenant">—</div>
      </div>
      <div class="status-item">
        <div class="k">Roles</div>
        <div class="v" id="auth-roles">—</div>
      </div>
      <div class="status-item">
        <div class="k">Expira</div>
        <div class="v" id="auth-exp">—</div>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="secondary" id="me" disabled>GET /api/me</button>
      <button class="secondary" id="logout" disabled>Cerrar sesión</button>
    </div>
    <pre id="payload">—</pre>
  </section>
</main>

<footer>pharma-server · ERP on-prem · ventana embebida (modo --app de Edge)</footer>

<script>
const $ = (id) => document.getElementById(id);
let token = null;

async function fetchJson(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  return { ok: r.ok, status: r.status, body };
}

async function refreshStatus() {
  $("live").textContent = "…"; $("ready").textContent = "…";
  try {
    const root = await fetchJson("/");
    if (root.ok && root.body.version) $("version").textContent = "v" + root.body.version;
  } catch {}
  try {
    const live = await fetchJson("/health/live");
    $("live").textContent = live.ok ? "OK" : "DOWN";
    $("live").className = "v " + (live.ok ? "ok" : "err");
    if (live.body && live.body.uptime_secs != null) $("uptime").textContent = live.body.uptime_secs + "s";
  } catch { $("live").textContent = "DOWN"; $("live").className = "v err"; }
  try {
    const ready = await fetchJson("/health/ready");
    const dbok = ready.ok && ready.body && ready.body.checks && ready.body.checks.db === "ok";
    $("ready").textContent = dbok ? "OK" : "DEGRADED";
    $("ready").className = "v " + (dbok ? "ok" : "err");
  } catch { $("ready").textContent = "DOWN"; $("ready").className = "v err"; }
}

async function doLogin() {
  const msg = $("login-msg");
  msg.textContent = "…"; msg.className = "msg";
  const body = {
    tenant: $("tenant").value.trim(),
    email: $("email").value.trim(),
    password: $("password").value,
  };
  const r = await fetchJson("/api/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    msg.textContent = "Error: " + (r.body && r.body.error ? r.body.error : r.status);
    msg.className = "msg err";
    return;
  }
  token = r.body.token;
  msg.textContent = "Token recibido (" + r.body.expires_in + "s).";
  msg.className = "msg ok";
  $("me").disabled = false;
  $("logout").disabled = false;
  await doMe();
}

async function doMe() {
  if (!token) return;
  const r = await fetchJson("/api/me", { headers: { authorization: "Bearer " + token } });
  $("payload").textContent = JSON.stringify(r.body, null, 2);
  if (r.ok) {
    $("auth-state").textContent = "Autenticado";
    $("auth-state").className = "v ok";
    $("auth-tenant").textContent = r.body.tenant_id || "—";
    $("auth-roles").textContent = (r.body.roles || []).join(", ") || "—";
    if (r.body.exp) {
      const d = new Date(r.body.exp * 1000);
      $("auth-exp").textContent = d.toLocaleTimeString();
    }
  }
}

function doLogout() {
  token = null;
  $("auth-state").textContent = "No autenticado"; $("auth-state").className = "v";
  $("auth-tenant").textContent = "—";
  $("auth-roles").textContent = "—";
  $("auth-exp").textContent = "—";
  $("payload").textContent = "—";
  $("me").disabled = true;
  $("logout").disabled = true;
  $("login-msg").textContent = ""; $("login-msg").className = "msg";
}

$("refresh").addEventListener("click", refreshStatus);
$("login").addEventListener("click", doLogin);
$("me").addEventListener("click", doMe);
$("logout").addEventListener("click", doLogout);
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
