<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>RutAgent — tu negocio, con su agente</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#070a10; --bg-2:#0b0f17; --surface:#111726; --surface-2:#151c2d; --raise:#1a2235;
    --line:#222c42; --line-soft:#19212f;
    --txt:#eef2f9; --txt-2:#97a3ba; --txt-3:#5b6783;
    --brand:#19d39a; --brand-2:#13b9d6; --brand-deep:#0f9d75; --brand-soft:rgba(25,211,154,.12);
    --amber:#f5b53d; --amber-soft:rgba(245,181,61,.13); --danger:#ff5d6c; --danger-soft:rgba(255,93,108,.13);
    --info:#5aa9ff; --info-soft:rgba(90,169,255,.13); --violet:#a78bfa;
    --r:16px; --r-sm:10px; --r-xs:7px;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 24px 50px -28px rgba(0,0,0,.85);
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    --ff-num:"SF Mono",ui-monospace,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
    --nav-w:220px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--ff);
    letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;flex-direction:column;min-height:100dvh}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(1100px 540px at 78% -8%,rgba(25,211,154,.10),transparent 60%),
               radial-gradient(900px 480px at 0% 0%,rgba(19,185,214,.07),transparent 55%)}
  a{color:var(--brand);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  /* ---------- brand / header ---------- */
  .logo{display:flex;align-items:center;gap:9px}
  .logo svg{width:28px;height:28px;flex:none}
  .wordmark{font-weight:650;font-size:17px;letter-spacing:-.03em}
  .wordmark b{color:var(--brand);font-weight:750}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 18px;border-bottom:1px solid var(--line);background:rgba(11,15,23,.72);
    backdrop-filter:saturate(1.4) blur(12px);position:sticky;top:0;z-index:30}
  .hstatus{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt-2);
    background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--txt-3);transition:.3s}
  .dot.ok{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
  .hright{display:flex;align-items:center;gap:10px}
  .htenant{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-2);
    max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .htenant b{color:var(--txt);font-weight:600}
  .avatar{width:24px;height:24px;border-radius:7px;background:linear-gradient(145deg,var(--brand),var(--brand-2));
    color:#04140e;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  /* ---------- shell ---------- */
  .shell{flex:1;display:grid;grid-template-columns:var(--nav-w) 1fr;width:100%;max-width:1240px;margin:0 auto}
  nav.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:53px;align-self:start;height:calc(100dvh - 53px);overflow:auto}
  .navlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3);padding:12px 12px 5px;font-weight:600}
  .nav-i{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);
    color:var(--txt-2);font-size:14px;font-weight:500;cursor:pointer;transition:.13s;border:1px solid transparent;white-space:nowrap}
  .nav-i svg{width:18px;height:18px;flex:none;opacity:.8}
  .nav-i:hover{background:var(--surface);color:var(--txt)}
  .nav-i.on{background:var(--brand-soft);color:var(--txt);border-color:rgba(25,211,154,.25)}
  .nav-i.on svg{opacity:1;color:var(--brand)}
  .nav-i .badge{margin-left:auto;font-size:10.5px;background:var(--amber-soft);color:var(--amber);
    border-radius:999px;padding:1px 7px;font-weight:700;font-family:var(--ff-num)}
  main{min-width:0;padding:22px 22px 96px;display:flex;flex-direction:column;gap:16px}
  /* ---------- view header ---------- */
  .vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:2px}
  .vh h1{margin:0;font-size:21px;font-weight:680;letter-spacing:-.03em}
  .vh p{margin:3px 0 0;font-size:13px;color:var(--txt-2)}
  /* ---------- cards ---------- */
  .card{background:linear-gradient(155deg,var(--raise),var(--surface));
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
  .card.center{max-width:430px;margin:7vh auto 0;padding:24px}
  .card h2{margin:0 0 3px;font-size:17px;font-weight:640;letter-spacing:-.02em}
  .sub{margin:0 0 16px;font-size:13px;color:var(--txt-2);line-height:1.5}
  .sect-t{font-size:12.5px;font-weight:600;color:var(--txt-2);margin:2px 0 11px;display:flex;align-items:center;gap:8px}
  .sect-t .ln{height:1px;background:var(--line);flex:1}
  /* ---------- hero ---------- */
  .hero{background:linear-gradient(135deg,rgba(25,211,154,.16),rgba(19,185,214,.10) 55%,transparent);
    border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .hero h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em}
  .hero .when{font-size:12.5px;color:var(--txt-2);margin-top:3px}
  .hero .pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--txt-2)}
  .hero .pill b{color:var(--txt);font-family:var(--ff-num)}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-family:var(--ff-num)}
  .delta.up{color:var(--brand)}.delta.down{color:var(--danger)}.delta.flat{color:var(--txt-3)}
  /* ---------- kpi grid ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 15px;position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.0;transition:.2s}
  .kpi.accent::after{opacity:.9}.kpi.warn::after{background:var(--amber);opacity:.9}.kpi.bad::after{background:var(--danger);opacity:.9}
  .kpi .k{font-size:11px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .k svg{width:13px;height:13px;opacity:.7}
  .kpi .v{font-size:25px;font-weight:680;margin-top:7px;font-family:var(--ff-num);letter-spacing:-.03em;line-height:1}
  .kpi .v.warn{color:var(--amber)}.kpi .v.bad{color:var(--danger)}.kpi .v.ok{color:var(--brand)}
  .kpi .s{font-size:11.5px;color:var(--txt-3);margin-top:6px;font-weight:500}
  /* ---------- table ---------- */
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--txt-3);font-weight:600;padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:11px 13px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.018)}
  td.num,th.num{text-align:right;font-family:var(--ff-num);letter-spacing:-.02em}
  td.name{white-space:normal;font-weight:500;min-width:150px}
  .muted2{color:var(--txt-3)}
  /* ---------- badges ---------- */
  .bdg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--txt-2);background:var(--surface)}
  .bdg.ok{color:var(--brand);background:var(--brand-soft);border-color:rgba(25,211,154,.25)}
  .bdg.warn{color:var(--amber);background:var(--amber-soft);border-color:rgba(245,181,61,.25)}
  .bdg.bad{color:var(--danger);background:var(--danger-soft);border-color:rgba(255,93,108,.25)}
  .bdg.info{color:var(--info);background:var(--info-soft);border-color:rgba(90,169,255,.25)}
  .bdg.abc-A{color:var(--brand);background:var(--brand-soft)}.bdg.abc-B{color:var(--amber);background:var(--amber-soft)}.bdg.abc-C{color:var(--txt-2)}
  /* ---------- chart ---------- */
  .chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:8px}
  .bar{flex:1;min-width:5px;background:linear-gradient(180deg,var(--brand),var(--brand-deep));
    border-radius:4px 4px 2px 2px;position:relative;transition:.2s;min-height:3px;opacity:.85}
  .bar:hover{opacity:1;filter:brightness(1.12)}
  .bar.today{background:linear-gradient(180deg,var(--amber),#cf941f)}
  .chart-x{display:flex;gap:5px;margin-top:6px}.chart-x span{flex:1;text-align:center;font-size:9.5px;color:var(--txt-3);overflow:hidden}
  /* ---------- agent chat ---------- */
  .agent-head{display:flex;align-items:center;gap:12px;margin-bottom:15px}
  .agent-mark{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--brand),var(--brand-2));box-shadow:0 8px 22px -10px var(--brand)}
  .agent-mark svg{width:23px;height:23px;color:#04140e}
  .agent-head h2{margin:0;font-size:17px}.agent-head p{margin:2px 0 0;font-size:12.5px;color:var(--txt-2)}
  .chat{display:flex;flex-direction:column;gap:11px;min-height:140px;margin-bottom:14px}
  .bubble{max-width:90%;padding:12px 15px;border-radius:15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
  .bubble.me{align-self:flex-end;background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:#04140e;border-bottom-right-radius:5px;font-weight:550}
  .bubble.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble.bot.think{color:var(--txt-3)}
  .bubble.bot.err{border-color:rgba(255,93,108,.4);color:#ffb3bb}
  .bubble b.li{display:block;font-weight:400}
  .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--txt-3);margin:0 1px;animation:b 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:12.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--txt-2);cursor:pointer;transition:.14s;white-space:nowrap}
  .chip:hover{border-color:var(--brand);color:var(--txt);background:var(--brand-soft)}
  .askbar{display:flex;gap:8px}
  .askbar input{font-size:16px}
  .askbar .btn{width:auto;flex:none;padding:12px 18px}
  /* ---------- forms ---------- */
  .field{margin-bottom:13px}
  label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:6px;font-weight:550}
  input,select{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
    color:var(--txt);font-family:var(--ff);font-size:16px;padding:11px 13px;outline:none;transition:.16s}
  input::placeholder{color:var(--txt-3)}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);background:var(--surface)}
  .search{position:relative}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--txt-3)}
  .search input{padding-left:36px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:none;border-radius:var(--r-sm);padding:12px 16px;cursor:pointer;font-family:var(--ff);font-weight:620;font-size:15px;transition:.15s;
    background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:#04140e;box-shadow:0 12px 26px -14px var(--brand)}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:progress;filter:none}
  .btn.ghost{background:var(--surface);color:var(--txt-2);border:1px solid var(--line);box-shadow:none;width:auto;padding:8px 13px;font-size:13px;font-weight:600}
  .btn.ghost:hover{color:var(--txt);border-color:var(--brand)}
  .formmsg{font-size:13px;margin-top:10px;min-height:18px;line-height:1.4}
  .formmsg.err{color:var(--danger)}.formmsg.ok{color:var(--brand)}
  .rubros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}
  .rubro{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--bg-2);cursor:pointer;transition:.15s;font-size:11px;color:var(--txt-2);text-align:center}
  .rubro:hover{border-color:var(--brand);color:var(--txt)}
  .rubro.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--txt)}
  .rubro span{font-size:21px;line-height:1}
  /* ---------- states ---------- */
  .empty{text-align:center;padding:42px 20px;color:var(--txt-2)}
  .empty .ico{width:46px;height:46px;margin:0 auto 12px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
  .empty .ico svg{width:23px;height:23px;color:var(--txt-3)}
  .empty h3{margin:0 0 5px;font-size:15px;color:var(--txt);font-weight:600}
  .empty p{margin:0 auto;font-size:13px;max-width:340px;line-height:1.5}
  .skel{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .muted{color:var(--txt-2);font-size:13px}
  /* ---------- actions + modal ---------- */
  .actbar{display:inline-flex;gap:8px;flex-wrap:wrap}
  .btn.sm{width:auto;padding:9px 14px;font-size:13.5px}
  .btn.alt{background:var(--surface);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btn.alt:hover{border-color:var(--brand)}
  .ov{position:fixed;inset:0;background:rgba(4,7,12,.66);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.ov{align-items:center;padding:20px}}
  .modal{background:linear-gradient(155deg,var(--raise),var(--surface));border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92dvh;overflow:auto;box-shadow:var(--shadow)}
  @media(min-width:640px){.modal{border-radius:18px}}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--raise);z-index:2}
  .modal-h h3{margin:0;font-size:16px;font-weight:640}
  .modal-x{background:none;border:none;color:var(--txt-2);cursor:pointer;font-size:23px;line-height:1;padding:0 4px}
  .modal-b{padding:18px}
  .modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;position:sticky;bottom:0;background:var(--raise)}
  .modal-f .btn{flex:1}
  .pos-res{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px}
  .pos-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:14px}
  .pos-row:last-child{border:none}.pos-row:hover{background:var(--brand-soft)}
  .pos-row .p{color:var(--txt-3);font-family:var(--ff-num)}
  .cart{display:flex;flex-direction:column;gap:7px;margin:4px 0 10px}
  .cart-i{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
  .cart-i .nm{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qty{display:flex;align-items:center;gap:7px}
  .qty button{width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:var(--bg-2);color:var(--txt);font-size:16px;cursor:pointer;line-height:1}
  .qty b{min-width:18px;text-align:center;font-family:var(--ff-num)}
  .cart-tot{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:680;padding:8px 2px;font-family:var(--ff-num)}
  /* ---------- toast / misc ---------- */
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);
    background:var(--raise);border:1px solid var(--line);color:var(--txt);padding:11px 17px;border-radius:999px;
    font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  .spin{width:15px;height:15px;border:2px solid rgba(4,20,14,.35);border-top-color:#04140e;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  /* ---------- mobile ---------- */
  @media(max-width:760px){
    .shell{grid-template-columns:1fr}
    nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;border-right:none;
      border-top:1px solid var(--line);background:rgba(11,15,23,.94);backdrop-filter:blur(12px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;overflow-x:auto;gap:3px}
    .navlbl{display:none}
    .nav-i{flex-direction:column;gap:3px;font-size:10px;padding:7px 9px;min-width:60px;justify-content:center}
    .nav-i svg{width:20px;height:20px}.nav-i .badge{position:absolute;margin:0;top:3px;right:8px}
    .nav-i{position:relative}
    main{padding:16px 14px 90px}
    .rubros{grid-template-columns:repeat(3,1fr)}
    .htenant{max-width:28vw}
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="9" fill="url(#g)"/><path d="M11 20.5c0-3 2.2-5 5-5s5 2 5 5M16 13.2a2.4 2.4 0 100-4.8 2.4 2.4 0 000 4.8z" stroke="#04140e" stroke-width="2.1" stroke-linecap="round"/><circle cx="22.4" cy="10" r="2.1" fill="#04140e"/><defs><linearGradient id="g" x1="2" y1="2" x2="30" y2="30"><stop stop-color="#19d39a"/><stop offset="1" stop-color="#13b9d6"/></linearGradient></defs></svg>
    <span class="wordmark">Rut<b>Agent</b></span>
  </div>
  <div class="hright">
    <span class="hstatus"><span class="dot" id="dot"></span><span id="dot-label">conectando…</span></span>
    <span class="htenant hidden" id="htenant"></span>
    <button class="btn ghost hidden" id="logout">Salir</button>
  </div>
</header>

<div id="root">
  <main style="max-width:1240px;margin:0 auto;width:100%">
    <section class="card center" id="auth"><div id="auth-body"><p class="muted">Cargando…</p></div></section>
  </main>
</div>

<div id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(n)=>{const x=Number(n);return isNaN(x)?0:x;};
const clp=(n)=>num(n).toLocaleString("es-CL");
const money=(n)=>"$"+clp(n);
const hhmm=(iso)=>{try{return new Date(iso).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});}catch{return"—";}};
const fday=(iso)=>{try{return new Date(iso).toLocaleDateString("es-CL",{day:"2-digit",month:"short"});}catch{return"—";}};
let token=sessionStorage.getItem("rb_token")||null, me=null, lastSlug=sessionStorage.getItem("rb_slug")||"principal";
let bizName=sessionStorage.getItem("rb_biz")||"tu negocio";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600);}

async function api(path,opts={}){
  const h=Object.assign({},opts.headers||{});
  if(opts.body)h["content-type"]="application/json";
  if(token)h["authorization"]="Bearer "+token;
  let r;try{r=await fetch(U(path),{...opts,headers:h});}catch(e){return{ok:false,status:0,body:null};}
  let body=null;const ct=r.headers.get("content-type")||"";
  try{body=ct.includes("json")?await r.json():await r.text();}catch{}
  return{ok:r.ok,status:r.status,body};
}
const apiErr=(r)=>(r.body&&r.body.error&&r.body.error.message)||(r.body&&r.body.error)||(r.status===0?"Sin conexión":"Error "+r.status);

async function pingStatus(){
  try{const r=await fetch(U("/health/ready"));const j=await r.json();
    const ok=r.ok&&j&&j.checks&&j.checks.db==="ok";
    $("#dot").className="dot "+(ok?"ok":"bad");$("#dot-label").textContent=ok?"en línea":"degradado";
  }catch{$("#dot").className="dot bad";$("#dot-label").textContent="sin conexión";}
}

async function boot(){
  pingStatus();setInterval(pingStatus,8000);
  if(token){const m=await api("/api/v1/me");if(m.ok){me=m.body;return renderApp();}token=null;sessionStorage.removeItem("rb_token");}
  const s=await api("/api/v1/setup/status");
  $("#root").innerHTML=`<main style="max-width:1240px;margin:0 auto;width:100%"><section class="card center" id="auth"><div id="auth-body"></div></section></main>`;
  if(s.ok&&s.body&&s.body.needs_setup)renderSetup();else renderLogin();
}

async function doSetup(){
  const name=$("#s-name").value.trim(),email=$("#s-email").value.trim(),pass=$("#s-pass").value,msg=$("#s-msg");msg.className="formmsg";
  if(!name)return fail(msg,"Indica el nombre de tu negocio.");
  if(!email)return fail(msg,"Indica tu correo.");
  if(pass.length<8)return fail(msg,"La contraseña debe tener al menos 8 caracteres.");
  const b=$("#s-go");b.disabled=true;b.innerHTML='<span class="spin"></span>Creando…';
  const r=await api("/api/v1/setup",{method:"POST",body:JSON.stringify({business_name:name,email,password:pass,vertical:pickedRubro})});
  b.disabled=false;b.textContent="Crear mi negocio";
  if(!r.ok)return fail(msg,apiErr(r));
  token=r.body.token;sessionStorage.setItem("rb_token",token);
  if(r.body.tenant_slug){lastSlug=r.body.tenant_slug;sessionStorage.setItem("rb_slug",lastSlug);}
  const m=await api("/api/v1/me");me=m.ok?m.body:null;renderApp();toast("¡Negocio creado! 🎉");
}
function renderLogin(){
  $("#auth-body").innerHTML=`

async function doLogin(){
  const tenant=$("#l-tenant").value.trim(),email=$("#l-email").value.trim(),pass=$("#l-pass").value,msg=$("#l-msg");msg.className="formmsg";
  if(!tenant||!email||!pass)return fail(msg,"Completa sucursal, correo y contraseña.");
  const b=$("#l-go");b.disabled=true;b.innerHTML='<span class="spin"></span>Entrando…';
  const r=await api("/api/v1/login",{method:"POST",body:JSON.stringify({tenant,email,password:pass})});
  b.disabled=false;b.textContent="Entrar";
  if(!r.ok)return fail(msg,r.status===401?"Correo o contraseña incorrectos.":apiErr(r));
  token=r.body.token;sessionStorage.setItem("rb_token",token);lastSlug=tenant;sessionStorage.setItem("rb_slug",tenant);
  const m=await api("/api/v1/me");me=m.ok?m.body:null;renderApp();
}
const fail=(el,m)=>{el.className="formmsg err";el.textContent=m;};

async function loadBiz(){

function go(id){

  $$("#nav .nav-i").forEach(el=>el.classList.toggle("on",el.dataset.v===id));

  const def=VIEWS.find(x=>x.id===id);
  v.innerHTML=`<div class="vh"><div><h1>${def.label}</h1></div></div><div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:75%;margin-top:12px"></div><div class="skel" style="width:60%;margin-top:12px"></div></div>`;
  def.fn(v);
}

/* helpers for views */
function vhead(t,sub,right){return `<div class="vh"><div><h1>${esc(t)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>${right||""}</div>`;}
function empty(icon,t,p){return `<div class="card"><div class="empty"><div class="ico">${svg(icon)}</div><h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`;}
function errCard(m){return `<div class="card"><div class="empty"><div class="ico">${svg(I.spark)}</div><h3>No pudimos cargar esto</h3><p>${esc(m)}</p></div></div>`;}
function kpi(k,v,cls,sub,icon){return `<div class="kpi ${cls||""}"><div class="k">${icon?svg(icon):""}${esc(k)}</div><div class="v ${cls||""}">${v}</div>${sub?`<div class="s">${esc(sub)}</div>`:""}</div>`;}

const ST={paid:["Pagada","ok"],draft:["Borrador","warn"],received:["Recibida","ok"],cancelled:["Anulada","bad"],open:["Abierta","ok"],closed:["Cerrada",""]};

/* ---------------- view: Resumen ---------------- */
async function vResumen(v){
  const [d,sd,cs,ne]=await Promise.all([api("/api/v1/reports/dashboard"),api("/api/v1/reports/sales-daily"),api("/api/v1/cash-sessions"),api("/api/v1/reports/near-expiry")]);
  if(!d.ok)return v.innerHTML=vhead("Resumen")+errCard(apiErr(d));
  const b=d.body, vh=b.ventas_hoy||{}, vm=b.ventas_mes||{}, inv=b.inventario||{};
  const open=(cs.ok&&Array.isArray(cs.body))?cs.body.find(x=>x.status==="open"):null;
  const enCaja=open?money(open.closing_cash_expected||open.opening_cash):"—";
  const vencer=(ne.ok&&Array.isArray(ne.body))?ne.body.length:0;
  // ayer vs hoy desde sales-daily (fechas UTC, igual que el backend)
  const ds=(sd.ok&&Array.isArray(sd.body))?sd.body:[];
  const todayK=new Date().toISOString().slice(0,10), yK=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const rev=(k)=>{const r=ds.find(x=>x.date===k);return r?num(r.revenue):0;};
  const hoyRev=num(vh.revenue)||rev(todayK), ayerRev=rev(yK);
  const dpct=ayerRev>0?Math.round((hoyRev-ayerRev)/ayerRev*100):(hoyRev>0?100:0);
  const dHTML=ayerRev>0?`<span class="delta ${dpct>0?"up":dpct<0?"down":"flat"}">${dpct>0?"▲":dpct<0?"▼":"="} ${Math.abs(dpct)}% vs ayer</span>`:`<span class="delta flat">primer día con datos</span>`;
  const hr=new Date().getHours(), saludo=hr<12?"Buenos días":hr<20?"Buenas tardes":"Buenas noches";
  let html=`<div class="hero"><div><h1>${esc(saludo)}, ${esc(bizName)} 👋</h1><div class="when">${esc(fechaLarga())}</div></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap"><span class="pill">Hoy <b>${money(hoyRev)}</b> ${dHTML}</span><span class="pill">${open?"Caja abierta":"Caja cerrada"}</span></div></div>`;
  html+=`<div class="kpis">
    ${kpi("Ventas hoy",money(vh.revenue),"accent ok",`${num(vh.orders)} ventas · efvo ${money(vh.cash)} · tarj ${money(vh.card)}`,I.ventas)}
    ${kpi("En caja",enCaja,"accent",open?`caja «${esc(open.register_name)}» abierta`:"sin caja abierta",I.caja)}
    ${kpi("Ventas del mes",money(vm.revenue),"","¿"+num(vm.orders)+" ventas".replace("¿","")+"",I.reportes)}
    ${kpi("Valor inventario",money(inv.value),"",num(inv.active_skus)+" productos activos",I.inventario)}
    ${kpi("Stock bajo",clp(inv.low_stock),num(inv.low_stock)>0?"warn":"","de "+num(inv.total_skus)+" SKU",I.box)}
    ${kpi("Por vencer (30d)",clp(vencer),vencer>0?"warn":"","lotes próximos a vencer",I.spark)}
  </div>`;
  // chart
  if(sd.ok&&Array.isArray(sd.body)&&sd.body.length){
    const rows=sd.body.slice(-14), mx=Math.max(...rows.map(r=>num(r.revenue)),1), today=new Date().toISOString().slice(0,10);
    html+=`<div class="card"><div class="sect-t">Ventas últimos días<span class="ln"></span><span class="muted2" style="font-size:11.5px">máx ${money(mx)}</span></div>
      <div class="chart">${rows.map(r=>`<div class="bar ${r.date===today?"today":""}" style="height:${Math.round(num(r.revenue)/mx*100)}%" title="${esc(fday(r.date))}: ${money(r.revenue)} (${num(r.orders)} ventas)"></div>`).join("")}</div>
      <div class="chart-x">${rows.map(r=>`<span>${esc(fday(r.date).replace(".",""))}</span>`).join("")}</div></div>`;
  }
  // top + agent cta
  html+=`<div class="grid2">
    <div class="card"><div class="sect-t">Más vendidos del mes<span class="ln"></span></div>${topList(b.top_productos||[])}</div>
    <div class="card"><div class="agent-head"><div class="agent-mark">${svg(I.agente,1.7)}</div><div><h2>Pregúntale a tu negocio</h2><p>El agente te responde en segundos.</p></div></div>
      <div class="chips">${["prepárame el día","¿cuánto vendí hoy?","¿qué tengo que reponer?"].map(c=>`<button class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <button class="btn" id="toagent">Abrir el agente</button></div>
  </div>`;
  v.innerHTML=html;
  $("#toagent").onclick=()=>go("agente");
  $$(".chip",v).forEach(c=>c.onclick=()=>{pendingQ=c.dataset.q;go("agente");});
}
function topList(arr){
  if(!arr.length)return `<div class="muted">Aún sin ventas.</div>`;
  return `<div class="tbl-wrap"><table><tbody>${arr.slice(0,5).map(p=>`<tr><td class="num muted2">${p.rank}</td><td class="name">${esc(p.product_name)} ${p.abc_class?`<span class="bdg abc-${esc(p.abc_class)}" style="margin-left:4px">${esc(p.abc_class)}</span>`:""}</td><td class="num muted2">${num(p.qty_sold)} u.</td><td class="num">${money(p.revenue)}</td></tr>`).join("")}</tbody></table></div>`;
}

let pendingQ=null;
function vAgente(v){
  v.innerHTML=vhead("Agente","Háblale a tu negocio en español, como a tu socio.")+`
    <section class="card">
      <div class="chat" id="chat"></div>
      <div class="chips" id="chips"></div>
      <div class="askbar"><input id="q" placeholder="Escribe tu pregunta…" autocomplete="off"/><button class="btn" id="ask">Preguntar</button></div>
    </section>`;
  const chips=["prepárame el día","¿cuánto vendí hoy?","ventas de la semana","productos más vendidos","¿qué tengo que reponer?","¿qué se vence?","órdenes pendientes","¿cuánto hay en caja?"];
  $("#chips").innerHTML=chips.map(c=>`<button class="chip">${esc(c)}</button>`).join("");
  $$("#chips .chip").forEach(b=>b.onclick=()=>{$("#q").value=b.textContent;ask();});
  $("#ask").onclick=ask;$("#q").onkeydown=e=>{if(e.key==="Enter")ask();};
  botSay("¡Hola! Soy tu agente. Pregúntame «¿cuánto vendí hoy?», «prepárame el día» o «¿qué se vence?». Toca un atajo o escribe.");
  if(pendingQ){$("#q").value=pendingQ;pendingQ=null;ask();}else $("#q").focus();
}
function botSay(text,isErr){const c=$("#chat");const b=document.createElement("div");b.className="bubble bot"+(isErr?" err":"");
  // render bullet lines a touch nicer
  if(!isErr&&/(^|\n)\s*•/.test(text)){b.innerHTML=esc(text).split("\n").map(l=>/^\s*•/.test(l)?`<b class="li">${l}</b>`:l).join("\n");}
  else b.textContent=text;
  c.appendChild(b);c.scrollTop=c.scrollHeight;return b;}
function meSay(t){const c=$("#chat");const b=document.createElement("div");b.className="bubble me";b.textContent=t;c.appendChild(b);c.scrollTop=c.scrollHeight;}
async function ask(){
  const q=$("#q").value.trim();if(!q)return;$("#q").value="";meSay(q);
  const c=$("#chat");const th=document.createElement("div");th.className="bubble bot think typing";th.innerHTML="<span></span><span></span><span></span>";c.appendChild(th);c.scrollTop=c.scrollHeight;
  const r=await api("/api/v1/assist/ask",{method:"POST",body:JSON.stringify({question:q})});th.remove();
  if(!r.ok)return botSay(apiErr(r),true);
  botSay((r.body&&r.body.text)||"…");
}

async function vVentas(v){
  const r=await api("/api/v1/orders");
  if(!r.ok)return v.innerHTML=vhead("Ventas")+errCard(apiErr(r));
  const all=(Array.isArray(r.body)?r.body:[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!all.length)return v.innerHTML=vhead("Ventas","",actbtn("venta","+ Nueva venta"))+empty(I.ventas,"Aún no hay ventas","Vende tu primera boleta — toca «Nueva venta».");
  const tot=all.reduce((s,o)=>s+num(o.total),0), efvo=all.reduce((s,o)=>s+num(o.cash_amount),0), tarj=all.reduce((s,o)=>s+num(o.card_amount),0);
  let html=vhead("Ventas",all.length+" ventas registradas",actbtn("venta","+ Nueva venta"));
  html+=`<div class="kpis">${kpi("Total",money(tot),"accent ok",all.length+" boletas",I.ventas)}${kpi("Efectivo",money(efvo),"",null,I.caja)}${kpi("Tarjeta",money(tarj),"",null,I.ventas)}</div>`;
  html+=`<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Hora</th><th>Cliente</th><th>Método</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>${all.slice(0,80).map(o=>`<tr><td class="muted2">${hhmm(o.created_at)}</td><td class="name">${esc(o.customer_name||"—")}</td><td>${bdg(PM,o.payment_method)}</td><td class="num">${money(o.total)}</td><td>${bdg(ST,o.status)}</td></tr>`).join("")}</tbody></table></div></div>`;
  v.innerHTML=html;
}

/* ---------------- view: Inventario ---------------- */
async function vInventario(v){
  const [p,st]=await Promise.all([api("/api/v1/products"),api("/api/v1/products/stats")]);
  if(!p.ok)return v.innerHTML=vhead("Inventario")+errCard(apiErr(p));
  const prods=Array.isArray(p.body)?p.body:[], s=st.body||{};
  let html=vhead("Inventario",prods.length+" productos",actbtn("prod","+ Nuevo producto"));
  html+=`<div class="kpis">${kpi("Productos",clp(s.total),"",null,I.inventario)}${kpi("Valor",money(s.inventory_value),"accent",null,I.box)}${kpi("Stock bajo",clp(s.low_stock),num(s.low_stock)>0?"warn":"",null,I.spark)}${kpi("Agotados",clp(s.out_of_stock),num(s.out_of_stock)>0?"bad":"",null,I.box)}</div>`;
  html+=`<div class="card"><div class="search" style="margin-bottom:13px">${svg(I.search)}<input id="inv-q" placeholder="Buscar producto…"/></div><div id="inv-tbl"></div></div>`;
  v.innerHTML=html;
  const draw=(q)=>{
    const f=prods.filter(x=>!q||(x.name||"").toLowerCase().includes(q.toLowerCase()));
    $("#inv-tbl").innerHTML=f.length?`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Laboratorio</th><th class="num">Precio</th><th class="num">Stock</th></tr></thead><tbody>${f.slice(0,120).map(x=>{
      const low=num(x.stock)<=0?'bad':(num(x.stock)<5?'warn':'');
      return `<tr><td class="name">${esc(x.name)}</td><td class="muted2">${esc(x.laboratory||"—")}</td><td class="num">${money(x.price)}</td><td class="num"><span class="bdg ${low}">${clp(x.stock)}</span></td></tr>`;}).join("")}</tbody></table></div>`:`<div class="muted" style="padding:14px">Sin resultados para «${esc(q)}».</div>`;
  };
  draw("");$("#inv-q").oninput=e=>draw(e.target.value);
}

/* ---------------- view: Caja ---------------- */
async function vCaja(v){
  const cs=await api("/api/v1/cash-sessions");
  if(!cs.ok)return v.innerHTML=vhead("Caja")+errCard(apiErr(cs));
  const list=Array.isArray(cs.body)?cs.body:[], open=list.find(x=>x.status==="open");
  if(!open)return v.innerHTML=vhead("Caja","",actbtn("abrir","+ Abrir caja"))+empty(I.caja,"No hay caja abierta","Abre la caja al empezar el turno para registrar ventas en efectivo y cuadrar el cierre.");
  const id=String(open.id).replace(/^cash_register_session:/,"");
  const aq=await api("/api/v1/cash-sessions/"+id+"/arqueo");
  const a=aq.ok?aq.body:{};const sess=a.session||open;
  let html=vhead("Caja","Sesión «"+(open.register_name||"caja")+"» · abierta "+hhmm(open.opened_at),'<div class="actbar">'+actbtn("mov:"+open.id,"+ Ingreso/Retiro")+actbtn("cerrar:"+open.id,"Cerrar caja")+'</div>');
  html+=`<div class="kpis">
    ${kpi("Efectivo esperado",money(sess.closing_cash_expected||sess.opening_cash),"accent ok","en la caja ahora",I.caja)}
    ${kpi("Apertura",money(sess.opening_cash),"",null,I.box)}
    ${kpi("Ventas efectivo",money(a.cash_sales),"",null,I.ventas)}
    ${kpi("Ingresos / Retiros",money(a.movements_in)+" / "+money(a.movements_out),"",null,I.gastos)}
  </div>`;
  const mv=await api("/api/v1/cash-sessions/"+id+"/movements");
  const moves=(mv.ok&&Array.isArray(mv.body))?mv.body:[];
  html+=`<div class="card"><div class="sect-t">Movimientos<span class="ln"></span></div>${moves.length?`<div class="tbl-wrap"><table><thead><tr><th>Hora</th><th>Tipo</th><th>Motivo</th><th class="num">Monto</th></tr></thead><tbody>${moves.map(m=>`<tr><td class="muted2">${hhmm(m.created_at)}</td><td>${esc(m.kind||m.type||"—")}</td><td class="name">${esc(m.reason||m.notes||"—")}</td><td class="num">${money(m.amount)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">Sin movimientos manuales (solo ventas).</div>`}</div>`;
  v.innerHTML=html;
}

  let html=vhead("Compras",orders.length+" órdenes · "+sups.length+" proveedores");
  html+=`<div class="grid2">
    <div class="card"><div class="sect-t">Órdenes de compra<span class="ln"></span></div>${orders.length?`<div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>Estado</th><th class="num">Total</th></tr></thead><tbody>${orders.map(o=>`<tr><td class="name">${esc(supName(o.supplier))}</td><td>${bdg(ST,o.status)}</td><td class="num">${money(o.total)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">Sin órdenes de compra.</div>`}</div>
    <div class="card"><div class="sect-t">Proveedores<span class="ln"></span></div>${sups.length?`<div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>RUT</th><th>Contacto</th></tr></thead><tbody>${sups.map(s=>`<tr><td class="name">${esc(s.name)}</td><td class="muted2">${esc(s.rut||"—")}</td><td class="muted2">${esc(s.contact_phone||s.contact_name||"—")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">Sin proveedores.</div>`}</div>
  </div>`;

}

/* ---------------- view: Reportes ---------------- */
async function vReportes(v){
  const [tp,ne,sd]=await Promise.all([api("/api/v1/reports/top-products"),api("/api/v1/reports/near-expiry"),api("/api/v1/reports/sales-daily")]);
  const top=(tp.ok&&Array.isArray(tp.body))?tp.body:[], exp=(ne.ok&&Array.isArray(ne.body))?ne.body:[], days=(sd.ok&&Array.isArray(sd.body))?sd.body:[];
  let html=vhead("Reportes","Lo que importa de tu negocio, claro.");
  // sales chart
  if(days.length){const rows=days.slice(-14),mx=Math.max(...rows.map(r=>num(r.revenue)),1),today=new Date().toISOString().slice(0,10);
    html+=`<div class="card"><div class="sect-t">Ventas por día<span class="ln"></span></div><div class="chart">${rows.map(r=>`<div class="bar ${r.date===today?"today":""}" style="height:${Math.round(num(r.revenue)/mx*100)}%" title="${esc(fday(r.date))}: ${money(r.revenue)}"></div>`).join("")}</div><div class="chart-x">${rows.map(r=>`<span>${esc(fday(r.date).replace(".",""))}</span>`).join("")}</div></div>`;}
  html+=`<div class="grid2">
    <div class="card"><div class="sect-t">Productos más vendidos (ABC)<span class="ln"></span></div>${top.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Producto</th><th class="num">Vendidos</th><th class="num">Ingresos</th><th>Clase</th></tr></thead><tbody>${top.slice(0,10).map(p=>`<tr><td class="num muted2">${p.rank}</td><td class="name">${esc(p.product_name)}</td><td class="num muted2">${num(p.qty_sold)}</td><td class="num">${money(p.revenue)}</td><td><span class="bdg abc-${esc(p.abc_class||"C")}">${esc(p.abc_class||"—")}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">Aún sin datos.</div>`}</div>
    <div class="card"><div class="sect-t">Próximos a vencer<span class="ln"></span></div>${exp.length?`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Lote</th><th class="num">Días</th><th class="num">Stock</th></tr></thead><tbody>${exp.map(e=>`<tr><td class="name">${esc(e.product_name)}</td><td class="muted2">${esc(e.batch_code||"—")}</td><td class="num"><span class="bdg ${num(e.days_to_expiry)<=15?'bad':'warn'}">${num(e.days_to_expiry)}d</span></td><td class="num">${clp(e.stock)}</td></tr>`).join("")}</tbody></table></div>`:empty2("Nada por vencer","Ningún lote vence en los próximos 30 días. 👍")}</div>
  </div>`;
  v.innerHTML=html;
}
const empty2=(t,p)=>`<div class="empty" style="padding:26px 16px"><h3>${esc(t)}</h3><p>${esc(p)}</p></div>`;

/* ---------------- actions (write) ---------------- */
const btn=(id,label)=>`<button class="btn ghost" id="${id}">${esc(label)}</button>`;
function closeModal(){const o=$("#ov");if(o)o.remove();}
function showModal(title,bodyHTML,footHTML){
  closeModal();
  const o=document.createElement("div");o.className="ov";o.id="ov";
  o.innerHTML=`<div class="modal"><div class="modal-h"><h3>${esc(title)}</h3><button class="modal-x" id="mx">×</button></div><div class="modal-b">${bodyHTML}</div>${footHTML?`<div class="modal-f">${footHTML}</div>`:""}</div>`;
  document.body.appendChild(o);
  o.onclick=e=>{if(e.target===o)closeModal();};
  document.addEventListener("keydown",function esc2(e){if(e.key==="Escape"){closeModal();document.removeEventListener("keydown",esc2);}});
  $("#mx").onclick=closeModal;
  return o;
}
function ffield(f){
  if(f.type==="select")return `<div class="field"><label>${esc(f.label)}</label><select id="f-${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select></div>`;
  return `<div class="field"><label>${esc(f.label)}</label><input id="f-${f.name}" type="${f.type||"text"}" placeholder="${esc(f.ph||"")}" inputmode="${f.type==="number"?"numeric":"text"}"/></div>`;
}
function formModal(title,fields,submitLabel,onSubmit){
  showModal(title,fields.map(ffield).join("")+`<div class="formmsg" id="f-msg"></div>`,
    `<button class="btn alt sm" id="f-cancel">Cancelar</button><button class="btn" id="f-go">${esc(submitLabel)}</button>`);
  setTimeout(()=>{const i=$(".modal-b input,.modal-b select");if(i)i.focus();},30);
  $("#f-cancel").onclick=closeModal;
  const submit=async()=>{
    const vals={};fields.forEach(f=>vals[f.name]=$("#f-"+f.name).value.trim());
    const msg=$("#f-msg");msg.className="formmsg";
    const b=$("#f-go");b.disabled=true;b.innerHTML='<span class="spin"></span>Guardando…';
    const res=await onSubmit(vals);
    b.disabled=false;b.textContent=submitLabel;
    if(res&&res.err){msg.className="formmsg err";msg.textContent=res.err;return;}
    closeModal();toast((res&&res.msg)||"Listo ✓");go(cur);
  };
  $("#f-go").onclick=submit;
  $$(".modal-b input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")submit();});
}
function newCustomer(){formModal("Nuevo cliente",[{name:"name",label:"Nombre",ph:"Juan Pérez"},{name:"rut",label:"RUT (opcional)",ph:"12.345.678-9"},{name:"phone",label:"Teléfono (opcional)",ph:"+56 9 …"}],"Crear cliente",async v=>{
  if(!v.name)return{err:"Indica el nombre."};
  const r=await api("/api/v1/clientes",{method:"POST",body:JSON.stringify({name:v.name,rut:v.rut||null,phone:v.phone||null})});
  return r.ok?{msg:"Cliente creado ✓"}:{err:apiErr(r)};});}
function newProduct(){formModal("Nuevo producto",[{name:"name",label:"Nombre",ph:"Paracetamol 500mg"},{name:"price",label:"Precio (CLP)",type:"number",ph:"1990"},{name:"stock",label:"Stock inicial",type:"number",ph:"0"},{name:"laboratory",label:"Laboratorio (opcional)",ph:""}],"Crear producto",async v=>{
  if(!v.name)return{err:"Indica el nombre."};
  if(!v.price||num(v.price)<=0)return{err:"Indica un precio válido."};
  const r=await api("/api/v1/products",{method:"POST",body:JSON.stringify({name:v.name,price:String(num(v.price)),stock:parseInt(v.stock||"0",10)||0,laboratory:v.laboratory||null})});
  return r.ok?{msg:"Producto creado ✓"}:{err:apiErr(r)};});}
function newExpense(){formModal("Registrar gasto",[{name:"category",label:"Categoría",ph:"Arriendo, sueldos, servicios…"},{name:"description",label:"Detalle",ph:"Pago luz junio"},{name:"amount",label:"Monto (CLP)",type:"number",ph:"50000"}],"Registrar gasto",async v=>{
  if(!v.category)return{err:"Indica la categoría."};
  if(!v.amount||num(v.amount)<=0)return{err:"Indica un monto válido."};
  const r=await api("/api/v1/expenses",{method:"POST",body:JSON.stringify({category:v.category,description:v.description||v.category,amount:String(num(v.amount))})});
  return r.ok?{msg:"Gasto registrado ✓"}:{err:apiErr(r)};});}
function abrirCaja(){formModal("Abrir caja",[{name:"opening_cash",label:"Fondo inicial (CLP)",type:"number",ph:"50000"}],"Abrir caja",async v=>{
  const r=await api("/api/v1/cash-sessions",{method:"POST",body:JSON.stringify({register_name:"caja-1",opening_cash:String(num(v.opening_cash||0))})});
  return r.ok?{msg:"Caja abierta ✓"}:{err:apiErr(r)};});}
function cerrarCaja(id){formModal("Cerrar caja",[{name:"counted",label:"Efectivo contado (CLP)",type:"number",ph:"0"}],"Cerrar caja",async v=>{
  const r=await api("/api/v1/cash-sessions/"+id+"/close",{method:"POST",body:JSON.stringify({closing_cash_counted:String(num(v.counted||0))})});
  return r.ok?{msg:"Caja cerrada ✓"}:{err:apiErr(r)};});}
function movCaja(id){formModal("Ingreso / Retiro de caja",[{name:"tipo",label:"Tipo",type:"select",options:[["ingreso","Ingreso"],["retiro","Retiro"]]},{name:"amount",label:"Monto (CLP)",type:"number",ph:"10000"},{name:"reason",label:"Motivo",ph:"Vuelto, compra menor…"}],"Registrar",async v=>{
  if(!v.amount||num(v.amount)<=0)return{err:"Indica un monto válido."};
  if(!v.reason)return{err:"Indica el motivo."};
  const r=await api("/api/v1/cash-sessions/"+id+"/movements",{method:"POST",body:JSON.stringify({tipo:v.tipo,amount:String(num(v.amount)),reason:v.reason})});
  return r.ok?{msg:"Movimiento registrado ✓"}:{err:apiErr(r)};});}
/* POS — nueva venta */
let posCart=[],posProds=[];
async function posOpen(){
  posCart=[];
  if(!posProds.length){const r=await api("/api/v1/products");posProds=(r.ok&&Array.isArray(r.body))?r.body.filter(p=>p.active!==false):[];}
  showModal("Nueva venta",
    `<div class="search" style="margin-bottom:10px">${svg(I.search)}<input id="pos-q" placeholder="Buscar producto…" autocomplete="off"/></div>
     <div class="pos-res" id="pos-res"></div><div class="cart" id="pos-cart"></div>
     <div class="cart-tot"><span>Total</span><span id="pos-tot">$0</span></div>
     <div class="field"><label>Forma de pago</label><select id="pos-pm"><option value="pos_cash">Efectivo</option><option value="pos_debit">Débito</option><option value="pos_credit">Crédito</option></select></div>
     <div class="formmsg" id="pos-msg"></div>`,
    `<button class="btn alt sm" id="pos-cancel">Cancelar</button><button class="btn" id="pos-go">Cobrar</button>`);
  const total=()=>posCart.reduce((s,c)=>s+c.price*c.qty,0);
  const drawCart=()=>{
    $("#pos-cart").innerHTML=posCart.map(c=>`<div class="cart-i"><span class="nm">${esc(c.name)}</span><div class="qty"><button data-m="${esc(c.id)}">−</button><b>${c.qty}</b><button data-pl="${esc(c.id)}">+</button></div><span class="p" style="font-family:var(--ff-num);min-width:62px;text-align:right">${money(c.price*c.qty)}</span></div>`).join("");
    $("#pos-tot").textContent=money(total());
    $$("#pos-cart [data-pl]").forEach(b=>b.onclick=()=>{const c=posCart.find(x=>x.id===b.dataset.pl);c.qty++;drawCart();});
    $$("#pos-cart [data-m]").forEach(b=>b.onclick=()=>{let c=posCart.find(x=>x.id===b.dataset.m);c.qty--;if(c.qty<=0)posCart=posCart.filter(x=>x.id!==c.id);drawCart();});
  };
  const drawRes=(q)=>{const f=posProds.filter(p=>!q||(p.name||"").toLowerCase().includes(q.toLowerCase())).slice(0,30);
    $("#pos-res").innerHTML=f.length?f.map(p=>`<div class="pos-row" data-id="${esc(p.id)}"><span>${esc(p.name)}</span><span class="p">${money(p.price)}</span></div>`).join(""):`<div class="pos-row muted2">Sin resultados</div>`;
    $$("#pos-res .pos-row[data-id]").forEach(el=>el.onclick=()=>{const p=posProds.find(x=>x.id===el.dataset.id);const ex=posCart.find(c=>c.id===p.id);if(ex)ex.qty++;else posCart.push({id:p.id,name:p.name,price:num(p.price),qty:1});drawCart();});};
  drawRes("");drawCart();
  $("#pos-q").oninput=e=>drawRes(e.target.value);$("#pos-cancel").onclick=closeModal;
  $("#pos-go").onclick=async()=>{
    if(!posCart.length){const m=$("#pos-msg");m.className="formmsg err";m.textContent="Agrega al menos un producto.";return;}
    const pm=$("#pos-pm").value,tot=total(),body={items:posCart.map(c=>({product:c.id,product_name:c.name,quantity:c.qty,unit_price:String(c.price)})),payment_method:pm};
    if(pm==="pos_cash")body.cash_amount=String(tot);else body.card_amount=String(tot);
    const b=$("#pos-go");b.disabled=true;b.innerHTML='<span class="spin"></span>Cobrando…';
    const r=await api("/api/v1/pos/sale",{method:"POST",headers:{"Idempotency-Key":"pos-"+Date.now()},body:JSON.stringify(body)});
    b.disabled=false;b.textContent="Cobrar";
    if(!r.ok){const m=$("#pos-msg");m.className="formmsg err";m.textContent=apiErr(r);return;}
    closeModal();toast("Venta cobrada · "+money(tot)+" ✓");go(cur);
  };
}

const actbtn=(act,label)=>`<button class="btn ghost" data-act="${esc(act)}">${esc(label)}</button>`;

/* logout + action delegation */
function doLogout(){token=null;me=null;sessionStorage.removeItem("rb_token");
  $("#htenant").classList.add("hidden");$("#logout").classList.add("hidden");location.hash="";boot();}
document.addEventListener("click",e=>{
  if(e.target.closest("#logout"))return doLogout();
  const a=e.target.closest("[data-act]");if(!a)return;
  const raw=a.dataset.act,ci=raw.indexOf(":"),k=ci<0?raw:raw.slice(0,ci),arg=ci<0?"":raw.slice(ci+1);
  const map={venta:posOpen,prod:newProduct,gasto:newExpense,cliente:newCustomer,abrir:abrirCaja,cerrar:()=>cerrarCaja(arg),mov:()=>movCaja(arg)};
  if(map[k])map[k]();
});

boot();
