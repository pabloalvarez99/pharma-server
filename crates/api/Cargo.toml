[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pharma-api"
path = "src/main.rs"

[dependencies]
pharma-core = { path = "../core" }
db = { path = "../db" }
auth = { path = "../auth" }
domain = { path = "../domain" }
agent = { path = "../agent" }
license = { path = "../license" }
arc-swap.workspace = true
telemetry = { path = "../telemetry" }
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
axum-prometheus.workspace = true
chrono.workspace = true
surrealdb.workspace = true
uuid.workspace = true
csv.workspace = true
sha2 = "0.10"
hex.workspace = true
tar.workspace = true
flate2.workspace = true
tokio-cron-scheduler.workspace = true

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
hyper = "1"
tempfile = "3"
flate2.workspace = true
tar.workspace = true
serde_json.workspace = true
filetime = "0.2"
# Bench-only extras. `surrealdb` here re-declares with `kv-mem` so benches can
# spin up an in-memory store (the prod build keeps `kv-surrealkv` only).
# Cargo merges features across the two declarations for the test/bench build,
# but the bin still ships kv-surrealkv only.
surrealdb = { workspace = true, features = ["kv-mem"] }
rust_decimal = "1.37"
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }

[[bench]]
name = "pos_sale"
harness = false
