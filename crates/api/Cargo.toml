[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

# cdylib del server embebido vive en `crates/servidor-android` (no acá):
# (a) evita conflictos de merge con carriles que tocan api, (b) un cdylib en
# api emitiría api.dll en cada build Windows del workspace.
# Default de cargo = rlib.

[[bin]]
name = "pharma-api"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
pharma-core = { path = "../core" }
db = { path = "../db" }
auth = { path = "../auth" }
domain = { path = "../domain" }
assist = { path = "../assist" }
agent = { path = "../agent" }
license = { path = "../license" }
dte = { path = "../dte" }
jobs = { path = "../jobs" }
arc-swap.workspace = true
pharma-telemetry = { package = "pharma-telemetry", path = "../telemetry" }
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
axum-prometheus.workspace = true
# Same `metrics` facade version axum-prometheus 0.7 records through, so custom
# counters land in the global recorder rendered at /metrics.
metrics = "0.23"
chrono.workspace = true
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
surrealdb.workspace = true
uuid.workspace = true
csv.workspace = true
sha2 = "0.10"
hmac.workspace = true
bitflags = "2"
hex.workspace = true
subtle.workspace = true
# Decode base64-encoded cert (.pfx) uploads in `POST /api/v1/dte/cert`.
base64.workspace = true
reqwest.workspace = true
tar.workspace = true
flate2.workspace = true
tokio-cron-scheduler.workspace = true
governor.workspace = true
nonzero_ext.workspace = true

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
hyper = "1"
tempfile = "3"
flate2.workspace = true
tar.workspace = true
serde_json.workspace = true
filetime = "0.2"
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
hmac.workspace = true
sha2 = "0.10"
hex.workspace = true
jsonwebtoken.workspace = true
# CRL refresh unit test signs ephemeral CRLs (base64 sig over canonical-JSON).
base64.workspace = true
# `user_backup_zero_knowledge` cifra de verdad un marcador conocido antes de
# subirlo, para poder afirmar que ninguna ruta lo devuelve en claro. Sólo test:
# el server nunca cifra ni descifra nada.
aes-gcm.workspace = true
metrics-util = { version = "0.17", features = ["debugging"] }
# DTE endpoint tests mint a synthetic CAF + cert PEM (mirrors crates/dte tests).
rsa = { workspace = true, features = ["pem"] }
rand.workspace = true
# Bench-only extras. `surrealdb` here re-declares with `kv-mem` so benches can
# spin up an in-memory store (the prod build keeps `kv-surrealkv` only).
# Cargo merges features across the two declarations for the test/bench build,
# but the bin still ships kv-surrealkv only.
surrealdb = { workspace = true, features = ["kv-mem"] }
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }

[[bench]]
name = "pos_sale"
harness = false
