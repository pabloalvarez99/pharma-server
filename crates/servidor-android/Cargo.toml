[package]
name = "servidor-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cdylib del server embebido: puente JNI + lifecycle. Dominio via HTTP (ADR-0021)."
publish = false

# Solo cdylib: el artefacto es libservidor_android.so para jniLibs.
# No rlib — nadie del workspace de escritorio depende de este crate.
[lib]
name = "servidor_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Grafo de producción (H2 size) + force-link de `api::run`.
api = { path = "../api" }
tokio = { workspace = true }
# JNI solo para ciclo de vida / probe (H3+). Sin `invocation`: no hay libjvm
# en el proceso de la app Android; el runtime lo pone el ART.
jni = { version = "0.21", default-features = false }
