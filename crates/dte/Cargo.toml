[package]
name = "dte"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
quick-xml.workspace = true
rsa = { workspace = true, features = ["pem"] }
sha1.workspace = true
base64.workspace = true
surrealdb.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
# SII envío (9.1.d/e) — reqwest local al crate, NO workspace
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# cert encrypt-at-rest (9.1.i): argon2id KDF + AES-256-GCM + zeroize
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.6"
# XML DSig sign (9.1 sign completo): parse PFX → RSA priv + X509 cert
p12 = "0.6"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand.workspace = true
rsa = { workspace = true, features = ["pem"] }
# SII mock server (9.1.d/e tests) — dev-only
wiremock = "0.6"
# Generar PFX in-memory para tests sign/cert (no shipping cert real)
p12 = "0.6"
