# Drop-in de journald para la caja de feria.
# Copiar a:
#   /etc/systemd/journald.conf.d/rutbusiness.conf
# Luego:
#   sudo systemctl restart systemd-journald
#
# Limita disco y ráfagas de log. No reemplaza el log de Caddy
# (/var/log/caddy/rutagent.log).

[Journal]
RateLimitIntervalSec=30s
RateLimitBurst=200
SystemMaxUse=200M
