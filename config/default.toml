bind = "0.0.0.0:8080"

[db]
path = "./data/surreal"
namespace = "pharma"
database = "main"

[jwt]
secret = "change-me-in-production"
issuer = "pharma-server"
ttl_seconds = 3600

[otlp]
endpoint = ""
service_name = "pharma-api"

[metrics]
# Empty = /metrics returns 401. Set via PHARMA__METRICS__TOKEN in prod.
token = ""

[backup]
# Master switch for the nightly snapshot. true = runs on a sensible default
# schedule (03:00 daily) unless `schedule` overrides it; false = disabled.
enabled = true
# Cron (sec min hour day month weekday, UTC). Empty -> default "0 0 3 * * *".
schedule = ""
# Count-based retention: keep the N newest snapshot archives. 0 = keep all.
retention_count = 14
# Age-based retention: also prune archives older than N days. 0 = disabled.
retention_days = 0
# Keep the N newest backup_log audit rows. 0 = keep all.
log_retention = 90

[rate_limit]
# Token-bucket per tenant + per IP (governor). Defaults are production-safe.
enabled = true
tenant_per_min = 120
tenant_burst = 30
ip_per_min = 60
ip_burst = 20

[docs]
# Swagger UI at /swagger-ui + OpenAPI JSON at /api-docs/openapi.json.
# Flip off on hardened prod (PHARMA__DOCS__ENABLED=false).
enabled = true

[public_catalog]
# Opt-in only (ADR-0005). Default 404 to peers.
enabled = false
cors_origins = ["https://tu-farmacia.cl"]

[public_orders]
# HMAC-signed web→ERP order ingest (ADR-0012 pattern 2).
# Disabled by default; inject hmac_secret via PHARMA__PUBLIC_ORDERS__HMAC_SECRET.
enabled = false
hmac_secret = ""

[stock_webhook]
# ERP→web stock-change push (ADR-0013). Disabled = dispatcher is a no-op.
# Inject hmac_secret via PHARMA__STOCK_WEBHOOK__HMAC_SECRET, never commit.
enabled = false
target_url = ""
hmac_secret = ""

[crl]
# License revocation refresh (ADR-0006). Opt-in + offline-first: empty url =
# disabled (zero network). When set, a job walks the signed CRL diff chain
# {url}/crl-v{N}.json from the last seen version and degrades any revoked
# license to Free (never a kill-switch — ADR-0005 §6). Best-effort: network
# errors are logged and ignored.
url = ""
# Cron "sec min hour day month weekday" (UTC). Empty = every 6h.
schedule = ""

[user_backup]
# Respaldo cifrado del usuario en bucket propio (ADR-0022 / ADR-0023).
# El server sólo ve ciphertext: nada de acá alcanza para leer un respaldo.
#
#   none    valida y no guarda (default; una instalación on-prem no manda los
#           bytes de su dueño a la nube de nadie sin que lo pida)
#   memory  lab: vive en el proceso y muere con él
#   s3      R2 u otro S3-compatible
backend = "none"
bucket = ""
# R2: https://<account_id>.r2.cloudflarestorage.com
endpoint = ""
# R2 firma con region "auto".
region = "auto"
# NUNCA commitear valores acá. Inyectar por entorno:
#   PHARMA__USER_BACKUP__ACCESS_KEY_ID
#   PHARMA__USER_BACKUP__SECRET_ACCESS_KEY
access_key_id = ""
secret_access_key = ""
prefix = "user-backup/"
# Cuotas — sin esto la cuenta de costo del ADR-0023 es ficción. Los defaults
# salen de lo medido: un sábado de feria son 65,8 KB y la cola al tope 108 KB.
max_envelope_bytes = 4194304
max_versions_per_tenant = 5
# Los PUT (Class A) son el 96% de la factura, no los bytes: esto es control de
# costo antes que de abuso.
#
# Son dos límites porque hacen cosas distintas. El piso frena la ráfaga pero no
# acota el gasto: 900 s dejan pasar 96 subidas por día, que a 1.000.000 de
# usuarios son US$ 157.680/año. El tope diario es el que pone el techo — con 6
# el peor caso queda en US$ 9.855/año, y la app real sube una vez.
min_seconds_between_uploads = 900
max_uploads_per_day = 6
retention_days = 400
# Rescate sin JWT para el teléfono nuevo. Apagarlo deja a quien perdió el
# teléfono sin forma de volver.
rescue_enabled = true
