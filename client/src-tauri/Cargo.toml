# RutBusiness Client — Tauri 2 desktop launcher (LoL-style: login → ERP shell).
#
# STANDALONE workspace on purpose: the root pharma-server `[workspace]` excludes
# `client/src-tauri`, and declaring an empty `[workspace]` here stops cargo from
# walking up and re-attaching this crate to the server workspace. This keeps
# `cargo build --workspace` (server) free of Tauri/WebView2 deps, and lets the
# client pin its own dependency versions independently.
[workspace]

[package]
name = "rutbusiness-client"
version = "0.1.0"
description = "RutBusiness Client — desktop launcher for pharma-server (login + license + ERP shell)"
authors = ["Pablo Alvarez <pablobfa1999@gmail.com>"]
edition = "2021"
rust-version = "1.85"
license = "Proprietary"

# The Tauri build script + the bundled binary share one crate. The lib is what
# `tauri::Builder` lives in; the bin is a thin launcher (Windows/Linux/macOS).
[lib]
name = "rutbusiness_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rutbusiness-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls: no OpenSSL / no system C toolchain dependency on Windows. Matches
# the project's "no libclang/OpenSSL on Windows" stance (see CLAUDE.md stack).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync"] }
# v4 random UUID for per-request Idempotency-Key on POS sales (generated
# server-side in the Tauri command so each "Cobrar" click is a distinct sale).
uuid = { version = "1", features = ["v4"] }
# JWT + cert passphrases held in memory: zeroed on drop (logout/quit), never
# debug-printed (`secrecy::SecretString` wraps both the session token and the
# password/passphrase command arguments).
secrecy = { version = "0.10", features = ["serde"] }

# Signed auto-updates (P0.1): without this every fix means a manual reinstall
# on every node. Pubkey lives in tauri.conf.json; the private key stays OFF
# this machine's repo (client/keys/, gitignored).
#
# DESKTOP-ONLY on purpose: `tauri-plugin-updater` declares android/ios support
# level "none" (see its Cargo.toml `package.metadata.platforms.support`), so it
# must not enter the dependency graph of an Android/iOS build. The mobile store
# is the update channel there. Registration is `#[cfg(desktop)]` gated in
# `lib.rs`; this cfg is the Cargo-level equivalent (Cargo target tables can't
# use tauri's custom `desktop` cfg, only real target cfgs).
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# RAW spooler access for ESC/POS thermal printers (P0.4). Windows-only target:
# the same 0.61 line Tauri already pulls, so no new dependency tree.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Foundation"] }

[features]
# Default feature set; custom protocols toggled by Tauri tooling when needed.
custom-protocol = ["tauri/custom-protocol"]
